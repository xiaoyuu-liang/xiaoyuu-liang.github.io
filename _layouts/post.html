---
layout: base
---
<article class="article">
  <p class="back mono"><a href="{{ '/#writing' | relative_url }}">← All writing</a></p>
  <p class="kicker mono">{{ page.date | date: "%-d %B %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.tags.size > 0 %}<p class="entry__chips">{% for t in page.tags %}<span>{{ t }}</span>{% endfor %}</p>{% endif %}
  <div class="prose">{{ content }}</div>
</article>
